name: Deploy dist via SCP

on:
  push:
    branches:
      - master
      - 'feat/**'
  workflow_dispatch: {}

jobs:
  deploy:
    # Skip this job when a push's HEAD commit message contains 'WIP' (case-insensitive).
    # Note: GitHub expressions don't support toLower(), so check common capitalizations and guard when head_commit is missing.
    # Allow manual runs (workflow_dispatch) to always execute.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.event.head_commit == null || !(contains(github.event.head_commit.message, 'WIP') || contains(github.event.head_commit.message, 'wip') || contains(github.event.head_commit.message, '[WIP]') || contains(github.event.head_commit.message, '[wip]')))) }}
    runs-on: ubuntu-latest
    # Use the 'deploy' environment (environment-level secrets and protections apply)
    environment: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js (for build)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          npm ci
          npm run build --if-present

      - name: Compute remote directory
        id: set_remote_dir
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT=${GIT_SHA:0:7}
          BASE=${DEPLOY_PATH%/}
          REMOTE_DIR="$BASE/$SHORT"
          echo "remote_dir=$REMOTE_DIR" >> "$GITHUB_OUTPUT"

      - name: Pack dist into tar.gz
        id: pack_dist
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "No dist directory found, skipping upload"
            exit 1
          fi
          SHORT=${GIT_SHA:0:7}
          FILENAME="dist-${SHORT}.tar.gz"
          tar -czf "$FILENAME" -C dist .
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload dist via HTTP
        uses: Kaven-Universe/github-action-http-upload-file@v1
        with:
          server: ${{ secrets.DEPLOY_URL }}
          file: ${{ steps.pack_dist.outputs.filename }}
          json_stringify_form_data: '[{"key":"path","value":"${{ steps.set_remote_dir.outputs.remote_dir }}"},{"key":"token","value":"${{ secrets.DEPLOY_TOKEN }}"}]'

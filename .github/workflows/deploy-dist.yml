name: Deploy dist via SCP

on:
  push:
    branches:
      - master
      - 'feat/**'
  workflow_dispatch: {}

jobs:
  deploy:
    # Skip this job when a push's HEAD commit message contains 'WIP' (case-insensitive).
    # Note: GitHub expressions don't support toLower(), so check common capitalizations and guard when head_commit is missing.
    # Allow manual runs (workflow_dispatch) to always execute.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.event.head_commit == null || !(contains(github.event.head_commit.message, 'WIP') || contains(github.event.head_commit.message, 'wip') || contains(github.event.head_commit.message, '[WIP]') || contains(github.event.head_commit.message, '[wip]')))) }}
    runs-on: ubuntu-latest
    # Use the 'deploy' environment (environment-level secrets and protections apply)
    environment: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js (for build)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          npm ci
          npm run build --if-present

      - name: Compute remote directory
        id: set_remote_dir
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT=${GIT_SHA:0:7}
          BASE=${DEPLOY_PATH%/}
          REMOTE_DIR="$BASE/$SHORT"
          echo "remote_dir=$REMOTE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload dist via scp action
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "dist/"
          target: ${{ steps.set_remote_dir.outputs.remote_dir }}
